name: cron

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Run payment and deposit expiration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          : "${APP_URL:?APP_URL secret is required}"

          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --output cron-output.json \
            "${APP_URL%/}/api/cron/expire"

      - name: Validate cron JSON
        run: |
          set -euo pipefail
          python -m json.tool cron-output.json > /dev/null

      - name: Upload cron JSON artifact
        id: cron-json-artifact
        uses: actions/upload-artifact@v7
        with:
          path: cron-output.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Print cron JSON download link
        env:
          CRON_JSON_URL: ${{ steps.cron-json-artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          : "${CRON_JSON_URL:?Artifact URL output is empty}"
          printf 'Cron JSON: %s\n' "$CRON_JSON_URL"
